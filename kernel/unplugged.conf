# wmutils: installed as /etc/modprobe.d/wmutils-unplugged.conf
# by kernel/install.sh. Lets two parts sleep from boot while nothing is
# plugged into them; the USB-C ports are in unplugged.rules. The kernel
# build's dracut run copies it into the initramfs, where appledrm loads;
# it takes effect at the next boot. A kernel without the patch ignores
# the option with a warning in dmesg.
#
# gl9755_runtime_pm=1  The SD card reader, while its slot is empty.
#                      Needs 0007-mmc-sdhci-pci-gli-gl9755-runtime-pm.patch.
# hdmi_idle_off=1      The HDMI port's converter chip, while no monitor is
#                      plugged in. Needs
#                      0008-drm-apple-hdmi-converter-off-unplugged.patch.
# hdmi_idle_phy_off=1  With hdmi_idle_off, the HDMI port's PHY and the
#                      display crossbar too. Needs
#                      0010-drm-apple-hdmi-phy-off-unplugged.patch. It
#                      saved nothing that could be measured on this machine.
options sdhci_pci gl9755_runtime_pm=1
options appledrm hdmi_idle_off=1 hdmi_idle_phy_off=1
